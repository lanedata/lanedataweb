name: Scrape federaciones SPA (Playwright)

# Las federaciones SPA (Andalucía/faalive…) necesitan navegador headless, que es
# pesado para el deploy. Este job aparte las scrapea y commitea su JSON; el deploy
# normal lo fusiona. Corre antes del deploy diario.

on:
  schedule:
    - cron: '0 5 * * *'        # a diario 05:00 UTC (antes del deploy de las 07:00)
  workflow_dispatch:

permissions:
  contents: write             # para commitear el JSON

concurrency:
  group: scrape-spa
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps + Playwright
        run: |
          python -m pip install -r calendar_scraper/requirements.txt playwright
          python -m playwright install --with-deps chromium

      # Motor fantasy-atletismo-engine: aporta los adapters de navegador
      # (Valencia headless). Opcional: sin ENGINE_REPO_TOKEN se scrapean solo
      # las fuentes SPA propias (Andalucía).
      - name: Checkout motor (adapters de navegador)
        continue-on-error: true
        env:
          ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
        run: |
          if [ -n "$ENGINE_REPO_TOKEN" ]; then
            git clone --depth 1 "https://x-access-token:${ENGINE_REPO_TOKEN}@github.com/rrojjo/fantasy-atletismo-engine.git" fantasy-atletismo-engine
          else
            echo "ENGINE_REPO_TOKEN no configurado; solo fuentes SPA propias"
          fi

      - name: Scrape SPA federations
        run: python scripts/scrape_spa.py

      - name: Commit JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # spa_status.json se commitea también: es la referencia contra la que la
          # próxima pasada detecta regresiones (fuente que aportaba y ahora 0/falla).
          git add public/data/federaciones_spa.json public/data/spa_status.json
          git diff --staged --quiet || git commit -m "chore: refresca calendario SPA (federaciones con navegador)"
          git push
