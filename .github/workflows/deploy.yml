name: Deploy to GitHub Pages

on:
  push:
    branches: [main]           # Deploy on every push to main
  schedule:
    - cron: '0 7 * * *'        # Rebuild daily at 07:00 UTC to pick up new articles
  workflow_dispatch:            # Allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Clona el motor fantasy-atletismo-engine (repo privado) para usar sus
      # adapters de federación en el calendario. Requiere el secret
      # ENGINE_REPO_TOKEN (PAT con acceso de lectura a rrojjo/fantasy-atletismo-engine).
      # Sin él, el scraper sigue con sus fuentes propias.
      - name: Checkout motor (adapters de federaciones)
        continue-on-error: true
        env:
          ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
        run: |
          if [ -n "$ENGINE_REPO_TOKEN" ]; then
            git clone --depth 1 "https://x-access-token:${ENGINE_REPO_TOKEN}@github.com/rrojjo/fantasy-atletismo-engine.git" fantasy-atletismo-engine
          else
            echo "ENGINE_REPO_TOKEN no configurado; el calendario usa solo las fuentes propias"
          fi

      # Refresca el calendario desde la RFEA + adapters del motor. Si falla, el
      # build usa el JSON ya commiteado (public/data/competiciones.json) como respaldo.
      - name: Refresh calendar (RFEA + motor)
        continue-on-error: true
        run: |
          python -m pip install -r calendar_scraper/requirements.txt
          python scripts/scrape_calendar.py

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          # Leave NEXT_PUBLIC_BASE_PATH empty if you use a custom domain (lanedata.es).
          # The default '/lanedata' is used for mateogsilvaa.github.io/lanedata.
          NEXT_PUBLIC_BASE_PATH: ${{ secrets.NEXT_PUBLIC_BASE_PATH }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out     # next build with output:'export' writes here

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
